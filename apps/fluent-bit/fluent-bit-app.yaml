apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ghost-project

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.3

    helm:
      releaseName: fluent-bit
      values: |
        kind: DaemonSet

        serviceAccount:
          create: true

        env:
          - name: SPLUNK_HOST
            valueFrom:
              secretKeyRef:
                name: splunk-hec
                key: SPLUNK_HOST

          - name: SPLUNK_HEC_TOKEN
            valueFrom:
              secretKeyRef:
                name: splunk-hec
                key: SPLUNK_HEC_TOKEN

        config:
          service: |
            [SERVICE]
                Flush 5
                Log_Level info
                Daemon Off
                Parsers_File parsers.conf

          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                Parser cri
                Tag kube.*
                Mem_Buf_Limit 50MB
                Skip_Long_Lines On

          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off

          outputs: |
            [OUTPUT]
                Name splunk
                Match kube.*
                Host ${SPLUNK_HOST}
                Port 8088
                Splunk_Token ${SPLUNK_HEC_TOKEN}
                TLS On
                TLS.Verify On
                Splunk_Send_Raw On

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
