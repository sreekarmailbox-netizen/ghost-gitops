apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-auth
  namespace: mysql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: mysql-auth
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: /ghost-gitops/mysql-root-password

    - secretKey: mysql-password
      remoteRef:
        key: /ghost-gitops/mysql-password
---
